<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitTime</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#fff;color:#2f3437}.navbar,.btn-dark{background:#2f3437!important}.text-green{color:#198754}.card{border-radius:18px}.btn-success{background:#198754}.page{max-width:760px}.form-control,.form-select{border-radius:12px}
  </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
  <div class="container"><a class="navbar-brand fw-bold" href="/">FitTime</a>
    <div class="d-flex gap-2">
      {% if user.is_authenticated %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'cabinet' %}">Кабинет</a>
        <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Выход</a>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Вход</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container page py-4">
  {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
