<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitTime</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#fff;color:#333}.green{color:#198754}.box{border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}input,select,textarea{width:100%;padding:8px;margin-top:4px}
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container">
    <a class="navbar-brand" href="/">FitTime</a>
    {% if user.is_authenticated %}<a class="btn btn-light btn-sm" href="{% url 'logout' %}">Выход</a>{% endif %}
  </div>
</nav>
<div class="container" style="max-width:700px">
  {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
